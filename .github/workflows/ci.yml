name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege: this build needs only to read the repo. Override per-job if a
# step ever needs more (e.g. packages: write).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Uniface environment
        run: scripts\\setup-env.bat
      - name: Run build script
        run: scripts\\build.bat
